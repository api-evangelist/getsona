aid: getsona
name: Getsona
description: >-
  Getsona (Sona) is an AI-powered workforce management platform that helps large,
  multi-site organizations make better workforce decisions across forecasting,
  scheduling, time and attendance, HR, and payroll. Marketed as "AI for better
  workforce decisions," Sona serves enterprises in hospitality, hotels, care,
  retail, and logistics, with customers including Popeyes UK, Paul Bakery,
  Salutem Healthcare, and Liaise. The platform pairs operational scheduling with
  an enterprise app builder (Sona Forge) and a catalog of integrations, but as of
  this profile it publishes no public developer API, API documentation, SDKs,
  webhooks, or developer portal. Getsona is tracked in the API Evangelist network
  as a portfolio company of Felicis.
